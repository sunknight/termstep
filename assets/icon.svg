<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e9bff"/>
      <stop offset="1" stop-color="#4a6cff"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded-square canvas -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <!-- prompt chevron ">" -->
  <polyline points="330,372 552,512 330,652"
            fill="none" stroke="url(#accent)"
            stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- text cursor block -->
  <rect x="600" y="448" width="60" height="128" rx="15" fill="#e8ecff"/>
</svg>
