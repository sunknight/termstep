<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A90FF"/>
      <stop offset="1" stop-color="#2D6BE6"/>
    </linearGradient>
  </defs>
  <!-- 方案 D：极简 >_ 左 + 三横线右 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgD)"/>
  <!-- 左：>_ 终端提示符 -->
  <polyline points="240,384 376,512 240,640"
            fill="none" stroke="#FFFFFF"
            stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="440" y="448" width="64" height="128" rx="18" fill="#FFFFFF"/>
  <!-- 右：三横线（按钮/菜单列表） -->
  <rect x="600" y="372" width="240" height="44" rx="22" fill="#FFFFFF" opacity="0.95"/>
  <rect x="600" y="490" width="240" height="44" rx="22" fill="#FFFFFF" opacity="0.85"/>
  <rect x="600" y="608" width="240" height="44" rx="22" fill="#FFFFFF" opacity="0.70"/>
</svg>
