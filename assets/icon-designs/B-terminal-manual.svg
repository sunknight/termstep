<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A90FF"/>
      <stop offset="1" stop-color="#2D6BE6"/>
    </linearGradient>
  </defs>
  <!-- 方案 B：左终端 + 右翻页手册 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgB)"/>
  <!-- 左：深色终端方块 -->
  <rect x="150" y="300" width="400" height="424" rx="40" fill="#0F172A"/>
  <polyline points="225,470 315,520 225,570" fill="none" stroke="#60A5FA" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="355" y="455" width="40" height="130" rx="12" fill="#E2E8F0"/>
  <circle cx="200" cy="355" r="18" fill="#EF4444" opacity="0.85"/>
  <circle cx="257" cy="355" r="18" fill="#F59E0B" opacity="0.85"/>
  <circle cx="314" cy="355" r="18" fill="#22C55E" opacity="0.85"/>
  <!-- 右：翻开的文档（书脊 + 双页 + 文字行） -->
  <g transform="translate(610,300)">
    <!-- 书脊阴影 -->
    <rect x="2" y="0" width="248" height="424" rx="20" fill="#1E3A8A"/>
    <!-- 左页 -->
    <path d="M124,0 L124,424 L20,404 Q0,400 0,380 L0,44 Q0,24 20,20 Z" fill="#FFFFFF"/>
    <!-- 右页 -->
    <path d="M124,0 L124,424 L228,404 Q248,400 248,380 L248,44 Q248,24 228,20 Z" fill="#F1F5F9"/>
    <!-- 文字行（左页） -->
    <rect x="28" y="80" width="76" height="16" rx="8" fill="#94A3B8"/>
    <rect x="28" y="120" width="64" height="16" rx="8" fill="#94A3B8"/>
    <rect x="28" y="160" width="72" height="16" rx="8" fill="#94A3B8"/>
    <!-- 文字行（右页） -->
    <rect x="144" y="80" width="76" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="144" y="120" width="64" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="144" y="160" width="72" height="16" rx="8" fill="#CBD5E1"/>
  </g>
</svg>
